[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-muxpd"
version = "0.1.0"
description = "MuxWise-inspired phase-separated scheduling for HUST vLLM Ascend"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "greenlet>=3.1,<4", "httpx>=0.27"]
layered = ["greenlet>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the pinned HUST vLLM runtime", "npu: requires Ascend hardware"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Preserve the exact audit scripts whose hashes appear in archived receipts.
"evidence/**/*.py" = ["E501"]
