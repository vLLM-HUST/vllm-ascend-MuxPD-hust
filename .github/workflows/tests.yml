name: CPU policy and lane tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' greenlet
      - run: python -m pytest tests/test_policy.py tests/test_lanes.py -q
      - run: python -m ruff check .
