name: CPU policy, lane and graph contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' greenlet
      - run: python scripts/fetch_mod_consumer_evidence.py --config BENCHMARK_COLLECTION.json --destination "$RUNNER_TEMP/benchmark-collection"
      # Native scheduler/worker tests skip without the pinned Ascend runtime.
      - run: python -m pytest tests -q
        env:
          BENCHMARK_COLLECTION_ROOT: ${{ runner.temp }}/benchmark-collection
      - run: python -m ruff check .
      - run: python scripts/archive_tp8_evidence.py self-test
