name: CPU policy, lane and graph contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' greenlet
      # Native scheduler/worker tests skip without the pinned Ascend runtime.
      - run: python -m pytest tests -q
      - run: python -m ruff check .
